[lib]
name = "ballots"
crate-type = ["cdylib"]

[package]
name = "ballots"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = "1.0.0"
alloy-sol-types = "1.0.0"
bincode = "1.3"
elastic-elgamal = { version = "0.3.1", features = ["serde"] }
proc-macro2 = "1.0.95"
quote = "1.0.40"
rand = "0.8.5"
syn = { version = "2.0.100", features = ["full"] }
ballots-macros = { path = "macros" }
blind-rsa-signatures = "0.15.2"
