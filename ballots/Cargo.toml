[lib]
name = "ballots"
crate-type = ["cdylib"]

[package]
name = "ballots"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = "1.5.3"
alloy-sol-types = "1.5.3"
postcard = { version = "1.1.3", features = ["alloc"] }
elastic-elgamal = { version = "0.3.1", features = ["serde"] }
proc-macro2 = "1.0.95"
quote = "1.0.40"
rand = "0.8.5"
syn = { version = "2.0.100", features = ["full"] }
ballots-macros = { path = "macros" }
blind-rsa-signatures = "0.17.0"
rsa = "=0.10.0-rc.14"
pkcs8 = "=0.11.0-rc.10"
pkcs1 = "=0.8.0-rc.4"
der = "=0.8.0-rc.10"
spki = "=0.8.0-rc.4"
